<!-- React 挂载点 -->
<div id="root"></div>

<script>
  const mcqs = [];
  const flashcards = [];
</script>

<script type="text/babel">
  const { useState, useEffect } = React;

  // 自定义 SVG 图标组件，替代有 bug 的 Lucide-React 库，解决 Infinity 冲突
  const CheckCircle2 = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2.5"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <circle cx="12" cy="12" r="10" />
      <path d="m9 12 2 2 4-4" />
    </svg>
  );

  const XCircle = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2.5"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <circle cx="12" cy="12" r="10" />
      <path d="m15 9-6 6" />
      <path d="m9 9 6 6" />
    </svg>
  );

  const CreditCard = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <rect width="20" height="14" x="2" y="5" rx="2" />
      <line x1="2" x2="22" y1="10" y2="10" />
    </svg>
  );

  const ListChecks = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="m3 17 2 2 4-4" />
      <path d="m3 7 2 2 4-4" />
      <path d="M13 6h8" />
      <path d="M13 12h8" />
      <path d="M13 18h8" />
      <path d="m3 12 2 2 4-4" />
    </svg>
  );

  const Trophy = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
      <path d="M4 22h16" />
      <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34" />
      <path d="M12 2a6 6 0 0 1 6 6v3.5c0 1.63-1.22 3.14-2.85 3.3a6 6 0 0 1-6.3-5.96V8a6 6 0 0 1 6-6Z" />
    </svg>
  );

  const ChevronRight = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="m9 18 6-6-6-6" />
    </svg>
  );

  const ChevronLeft = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
  );

  const Lightbulb = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
      <path d="M9 18h6" />
      <path d="M10 22h4" />
    </svg>
  );

  const BookOpen = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
    </svg>
  );

  const Layers = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="m12 3-10 5L12 13l10-5-10-5Z" />
      <path d="m2 17 10 5 10-5" />
      <path d="m2 12 10 5 10-5" />
    </svg>
  );

  const RichContent = ({ value, imageClassName = "max-h-72" }) => {
    const content =
      typeof value === "string"
        ? { text: value, images: [] }
        : { text: value?.text || "", images: value?.images || [] };

    return (
      <div className="min-w-0 space-y-3">
        {content.text && (
          <div className="whitespace-pre-wrap break-words">{content.text}</div>
        )}
        {content.images.map((image, index) => (
          <figure key={`${image.src}-${index}`} className="space-y-1.5">
            <img
              src={image.src}
              alt={image.alt || ""}
              loading="lazy"
              decoding="async"
              className={`mx-auto w-auto max-w-full rounded-xl object-contain ${imageClassName}`}
            />
            {image.caption && (
              <figcaption className="text-center text-xs font-normal opacity-70">
                {image.caption}
              </figcaption>
            )}
          </figure>
        ))}
      </div>
    );
  };

  function App() {
    const [view, setView] = useState("menu"); // 'menu', 'quiz', 'flashcard'
    const [currentIdx, setCurrentIdx] = useState(0);
    const [score, setScore] = useState(0);
    const [showResult, setShowResult] = useState(false);
    const [selectedOptions, setSelectedOptions] = useState([]);
    const [isAnswerSubmitted, setIsAnswerSubmitted] = useState(false);
    const [flipped, setFlipped] = useState(false);
    const [showNavModal, setShowNavModal] = useState(false); // 题目跳转导航面板显隐状态

    // 答错记录追踪（供最后结果页查看分析）
    const [wrongAnswers, setWrongAnswers] = useState([]);
    const hasMcqs = mcqs.length > 0;
    const hasFlashcards = flashcards.length > 0;

    const resetState = () => {
      setCurrentIdx(0);
      setScore(0);
      setShowResult(false);
      setSelectedOptions([]);
      setIsAnswerSubmitted(false);
      setFlipped(false);
      setWrongAnswers([]);
    };

    // 将旧版单值 c 和新版列表 c 统一为答案索引列表。
    const getCorrectAnswers = (question) =>
      Array.isArray(question.c) ? question.c : [question.c];

    const submitQuizAnswer = (userAnswers) => {
      if (isAnswerSubmitted || userAnswers.length === 0) return;

      const correctAnswers = getCorrectAnswers(mcqs[currentIdx]);
      const sortedUserAnswers = [...userAnswers].sort((a, b) => a - b);
      const sortedCorrectAnswers = [...correctAnswers].sort((a, b) => a - b);
      const isCorrect =
        sortedUserAnswers.length === sortedCorrectAnswers.length &&
        sortedUserAnswers.every(
          (answer, index) => answer === sortedCorrectAnswers[index],
        );

      setSelectedOptions(userAnswers);
      setIsAnswerSubmitted(true);
      if (isCorrect) {
        setScore((currentScore) => currentScore + 1);
      } else {
        setWrongAnswers((answers) => [
          ...answers,
          {
            ...mcqs[currentIdx],
            userAnswers,
            userLetter: sortedUserAnswers
              .map((answer) => String.fromCharCode(65 + answer))
              .join("、"),
            correctLetter: sortedCorrectAnswers
              .map((answer) => String.fromCharCode(65 + answer))
              .join("、"),
          },
        ]);
      }

      setTimeout(() => {
        if (currentIdx < mcqs.length - 1) {
          setCurrentIdx((index) => index + 1);
          setSelectedOptions([]);
          setIsAnswerSubmitted(false);
        } else {
          setShowResult(true);
        }
      }, 1400);
    };

    const handleQuizAnswer = (idx) => {
      if (isAnswerSubmitted) return;

      const isMultipleChoice =
        getCorrectAnswers(mcqs[currentIdx]).length > 1;
      if (!isMultipleChoice) {
        submitQuizAnswer([idx]);
        return;
      }

      setSelectedOptions((options) =>
        options.includes(idx)
          ? options.filter((option) => option !== idx)
          : [...options, idx],
      );
    };

    // 跳转到指定题目
    const jumpToQuestion = (idx) => {
      setCurrentIdx(idx);
      setSelectedOptions([]);
      setIsAnswerSubmitted(false);
      setFlipped(false);
      setShowNavModal(false);
    };

    if (view === "menu") {
      return (
        <div className="max-w-2xl mx-auto pt-4 px-0 sm:pt-10 sm:px-4 md:pt-16">
          <div className="text-center mb-7 sm:mb-12">
            <div className="inline-flex p-3 sm:p-4 bg-brand-50 text-brand-800 rounded-2xl sm:rounded-3xl mb-4">
              <BookOpen size={40} />
            </div>
            <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-3 break-words">
              <div>title</div>
            </h1>
            <p className="text-base sm:text-lg text-slate-500 leading-relaxed">
              <div>description</div>
            </p>
          </div>

          <div
            className={`grid gap-3 sm:gap-6 mb-8 ${hasMcqs && hasFlashcards ? "sm:grid-cols-2" : "grid-cols-1"}`}
          >
            {hasMcqs && (
              <button
                onClick={() => {
                  setView("quiz");
                  resetState();
                }}
                className="flex min-h-40 flex-col text-left p-5 sm:p-6 bg-white border border-slate-200 rounded-2xl hover:border-brand-500 hover:shadow-lg transition-all group focus:outline-none focus:ring-2 focus:ring-brand-500"
              >
                <div className="p-3 bg-brand-50 text-brand-800 rounded-xl group-hover:bg-brand-800 group-hover:text-white transition-colors mb-4 w-fit">
                  <ListChecks size={28} />
                </div>
                <h3 className="font-bold text-xl text-slate-800 mb-1">
                  选择题闯关
                </h3>
                <span className="mt-auto text-brand-800 text-sm font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                  开始挑战 <ChevronRight size={16} />
                </span>
              </button>
            )}

            {hasFlashcards && (
              <button
                onClick={() => {
                  setView("flashcard");
                  resetState();
                }}
                className="flex min-h-40 flex-col text-left p-5 sm:p-6 bg-white border border-slate-200 rounded-2xl hover:border-brand-500 hover:shadow-lg transition-all group focus:outline-none focus:ring-2 focus:ring-brand-500"
              >
                <div className="p-3 bg-brand-50 text-brand-800 rounded-xl group-hover:bg-brand-800 group-hover:text-white transition-colors mb-4 w-fit">
                  <CreditCard size={28} />
                </div>
                <h3 className="font-bold text-xl text-slate-800 mb-1">
                  简答题抽认卡
                </h3>
                <span className="mt-auto text-brand-800 text-sm font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                  开始背诵 <ChevronRight size={16} />
                </span>
              </button>
            )}
          </div>
        </div>
      );
    }

    if (view === "quiz") {
      return (
        <div className="max-w-2xl mx-auto pt-1 px-0 sm:pt-4 sm:px-4 md:pt-8">
          {/* 导航头 */}
          <div className="flex items-center justify-between gap-2 mb-4 sm:mb-6">
            <button
              onClick={() => setView("menu")}
              className="min-h-11 shrink-0 text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1 font-medium"
            >
              <ChevronLeft size={18} /> 返回主页
            </button>

            <div className="flex min-w-0 items-center gap-2 sm:gap-3">
              <button
                onClick={() => setShowNavModal(true)}
                className="min-h-11 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-colors flex items-center gap-1"
              >
                <Layers size={16} /> <span className="hidden sm:inline">跳转题目</span><span className="sm:hidden">题目</span>
              </button>
              <div className="whitespace-nowrap px-3 py-2 bg-brand-50 text-brand-800 rounded-xl text-sm font-bold">
                <span className="hidden sm:inline">进度: </span>{currentIdx + 1} / {mcqs.length}
              </div>
            </div>
          </div>

          {/* 进度条 */}
          <div className="w-full h-2 bg-slate-200 rounded-full mb-5 sm:mb-8 overflow-hidden">
            <div
              className="h-full bg-brand-800 transition-all duration-300"
              style={{ width: `${((currentIdx + 1) / mcqs.length) * 100}%` }}
            ></div>
          </div>

          {!showResult ? (
            <div className="mobile-question-scroll">
              <div className="mb-4 sm:mb-6 bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 shadow-sm">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-xs font-bold text-brand-800 uppercase tracking-wider">
                    QUESTION {currentIdx + 1}
                  </span>
                  <span
                    className="px-2 py-0.5 rounded-full bg-brand-100 text-xs font-bold text-brand-900"
                  >
                    {getCorrectAnswers(mcqs[currentIdx]).length > 1
                      ? "多选题"
                      : "单选题"}
                  </span>
                </div>
                <div className="text-lg sm:text-xl font-bold text-slate-800 leading-relaxed">
                  <RichContent value={mcqs[currentIdx].q} />
                </div>
                {getCorrectAnswers(mcqs[currentIdx]).length > 1 && (
                  <p className="text-sm text-slate-500 mt-3">
                    可选择多个答案，选好后点击“提交答案”
                  </p>
                )}
              </div>
              <div className="grid gap-3">
                {mcqs[currentIdx].a.map((opt, i) => {
                  const correctAnswers = getCorrectAnswers(mcqs[currentIdx]);
                  const isSelected = selectedOptions.includes(i);
                  const isCorrectOption = correctAnswers.includes(i);
                  let style =
                    "border-slate-200 bg-white hover:border-slate-300 hover:shadow-sm";
                  if (isAnswerSubmitted) {
                    if (isCorrectOption) {
                      style =
                        "border-emerald-500 bg-emerald-50 text-emerald-800 font-semibold";
                    } else if (isSelected) {
                      style =
                        "border-rose-500 bg-rose-50 text-rose-800 font-semibold";
                    } else {
                      style = "border-slate-100 bg-slate-50 text-slate-400";
                    }
                  } else if (isSelected) {
                    style =
                      "border-brand-500 bg-brand-50 text-brand-900 font-semibold shadow-sm";
                  }
                  return (
                    <button
                      key={i}
                      onClick={() => handleQuizAnswer(i)}
                      aria-pressed={isSelected}
                      disabled={isAnswerSubmitted}
                      className={`min-h-14 p-4 sm:p-5 text-left border-2 rounded-xl transition-all duration-200 flex items-center justify-between break-words focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 ${style}`}
                    >
                      <div className="flex min-w-0 flex-1 items-start gap-1 leading-relaxed">
                        <span className="shrink-0">
                          {String.fromCharCode(65 + i)}.
                        </span>
                        <div className="min-w-0 flex-1">
                          <RichContent value={opt} imageClassName="max-h-48" />
                        </div>
                      </div>
                      {isAnswerSubmitted && isCorrectOption && (
                        <CheckCircle2 className="text-emerald-500 shrink-0 ml-3" />
                      )}
                      {isAnswerSubmitted && isSelected && !isCorrectOption && (
                        <XCircle className="text-rose-500 shrink-0 ml-3" />
                      )}
                      {!isAnswerSubmitted &&
                        isSelected &&
                        correctAnswers.length > 1 && (
                          <CheckCircle2 className="text-brand-500 shrink-0 ml-3" />
                        )}
                    </button>
                  );
                })}
              </div>
              {getCorrectAnswers(mcqs[currentIdx]).length > 1 &&
                !isAnswerSubmitted && (
                  <button
                    onClick={() => submitQuizAnswer(selectedOptions)}
                    disabled={selectedOptions.length === 0}
                    className="mt-5 w-full px-6 py-3 bg-brand-800 text-white rounded-xl font-bold hover:bg-brand-900 transition-colors shadow-md disabled:bg-slate-300 disabled:cursor-not-allowed disabled:shadow-none"
                  >
                    提交答案
                    {selectedOptions.length > 0 &&
                      `（已选 ${selectedOptions.length} 项）`}
                  </button>
                )}
            </div>
          ) : (
            <div className="text-center py-8 sm:py-12 px-4 sm:px-6 bg-white rounded-2xl sm:rounded-3xl shadow-sm border border-slate-200">
              <Trophy
                size={72}
                className="mx-auto text-yellow-500 mb-4 animate-bounce"
              />
              <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2">
                测试完成!
              </h2>
              <p className="text-slate-500 mb-6">
                您的正确率达到了{" "}
                <span className="text-brand-800 font-bold text-2xl">
                  {Math.round((score / mcqs.length) * 100)}%
                </span>
              </p>

              <div className="bg-slate-50 border border-slate-100 rounded-xl p-4 mb-8 text-sm grid grid-cols-2 gap-4 sm:gap-8 w-full">
                <div>
                  正确题数:{" "}
                  <span className="font-bold text-emerald-600">{score}</span>
                </div>
                <div>
                  错误题数:{" "}
                  <span className="font-bold text-rose-500">
                    {mcqs.length - score}
                  </span>
                </div>
              </div>

              {wrongAnswers.length > 0 && (
                <div className="text-left mb-8 max-h-72 overflow-y-auto border border-slate-200 rounded-xl p-4 bg-slate-50">
                  <h3 className="font-bold text-slate-700 mb-3 border-b pb-2">
                    错题汇总
                  </h3>
                  <div className="space-y-4">
                    {wrongAnswers.map((item, idx) => (
                      <div key={idx} className="text-xs">
                        <div className="flex items-start gap-1 font-semibold text-slate-800">
                          <span className="shrink-0">{idx + 1}.</span>
                          <div className="min-w-0 flex-1">
                            <RichContent
                              value={item.q}
                              imageClassName="max-h-32"
                            />
                          </div>
                        </div>
                        <p className="text-rose-600 mt-1">
                          您的回答: {item.userLetter} (错误)
                        </p>
                        <p className="text-emerald-600">
                          正确答案: {item.correctLetter}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex flex-col-reverse sm:flex-row gap-3 sm:gap-4 justify-center">
                <button
                  onClick={resetState}
                  className="min-h-12 w-full sm:w-auto px-6 py-3 bg-slate-100 text-slate-700 rounded-xl sm:rounded-full font-bold hover:bg-slate-200 transition-colors"
                >
                  重新测试
                </button>
                <button
                  onClick={() => {
                    resetState();
                    setView("menu");
                  }}
                  className="min-h-12 w-full sm:w-auto px-6 py-3 bg-brand-800 text-white rounded-xl sm:rounded-full font-bold hover:bg-brand-900 transition-colors shadow-md"
                >
                  返回主页
                </button>
              </div>
            </div>
          )}

          {/* 选择题快速导航模态框 */}
          {showNavModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-2xl sm:rounded-2xl max-w-lg w-full max-h-[85dvh] overflow-hidden flex flex-col shadow-2xl">
                <div className="p-4 sm:p-5 border-b flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <Layers size={18} className="text-brand-600" />{" "}
                    选择题目录跳转
                  </h3>
                  <button
                    onClick={() => setShowNavModal(false)}
                    aria-label="关闭题目目录"
                    className="inline-flex h-11 w-11 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-200 text-2xl font-normal"
                  >
                    &times;
                  </button>
                </div>
                <div className="p-4 sm:p-6 pb-[max(1rem,env(safe-area-inset-bottom))] overflow-y-auto grid grid-cols-5 sm:grid-cols-6 gap-2">
                  {mcqs.map((_, i) => (
                    <button
                      key={i}
                      onClick={() => jumpToQuestion(i)}
                      className={`min-h-11 py-2 text-sm font-bold rounded-lg border transition-all ${currentIdx === i ? "bg-brand-800 border-brand-800 text-white" : "border-slate-200 hover:border-brand-500 text-slate-700 hover:bg-brand-50"}`}
                    >
                      {i + 1}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    if (view === "flashcard") {
      return (
        <div className="max-w-2xl mx-auto pt-1 px-0 sm:pt-4 sm:px-4 md:pt-8">
          {/* 导航头 */}
          <div className="flex items-center justify-between gap-2 mb-4 sm:mb-6">
            <button
              onClick={() => setView("menu")}
              className="min-h-11 shrink-0 text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1 font-medium"
            >
              <ChevronLeft size={18} /> 返回主页
            </button>

            <div className="flex min-w-0 items-center gap-2 sm:gap-3">
              <button
                onClick={() => setShowNavModal(true)}
                className="min-h-11 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-colors flex items-center gap-1"
              >
                <Layers size={16} /> <span className="hidden sm:inline">选卡列表</span><span className="sm:hidden">选卡</span>
              </button>
              <div className="whitespace-nowrap px-3 py-2 bg-brand-50 text-brand-800 rounded-xl text-sm font-bold">
                <span className="hidden sm:inline">卡片: </span>{currentIdx + 1} / {flashcards.length}
              </div>
            </div>
          </div>

          {/* 进度条 */}
          <div className="w-full h-2 bg-slate-200 rounded-full mb-5 sm:mb-8 overflow-hidden">
            <div
              className="h-full bg-brand-800 transition-all duration-300"
              style={{
                width: `${((currentIdx + 1) / flashcards.length) * 100}%`,
              }}
            ></div>
          </div>

          {/* 翻转卡片结构 */}
          <div
            className={`flip-card ${flipped ? "flipped" : ""} w-full`}
            onClick={() => setFlipped((isFlipped) => !isFlipped)}
          >
            <div
              className="flip-card-inner"
              style={{
                transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
              }}
            >
              {/* 卡片正面 (问题) */}
              <div className="flip-card-front bg-white border border-slate-200 text-slate-800 flex flex-col justify-between">
                <div className="p-3 bg-brand-50 text-brand-600 rounded-full mt-4 self-center">
                  <Lightbulb size={28} />
                </div>
                <div className="my-auto min-h-0 w-full overflow-y-auto overscroll-contain px-2 py-2 scrollbar-hide sm:px-4">
                  <span className="text-xs font-bold text-slate-400 block mb-2">
                    QUESTION {currentIdx + 1}
                  </span>
                  <div className="text-lg sm:text-xl font-bold leading-relaxed">
                    <RichContent
                      value={flashcards[currentIdx].q}
                      imageClassName="max-h-48"
                    />
                  </div>
                </div>
                <p className="text-slate-400 text-xs font-medium pb-4 flex items-center gap-1 animate-pulse">
                  <svg
                    className="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      strokeWidth="2"
                      d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"
                    />
                  </svg>
                  点击卡片翻看参考答案
                </p>
              </div>

              {/* 卡片背面 (要点解析) */}
              <div className="flip-card-back bg-brand-950 text-white border border-brand-900 text-left items-start overflow-y-auto scrollbar-hide flex flex-col justify-between">
                <div className="w-full">
                  <h4 className="text-brand-300 font-bold mb-4 flex items-center gap-2 border-b border-brand-900 pb-2">
                    <CheckCircle2 size={18} /> 核心要点 / 答案分析
                  </h4>
                  <div className="text-base leading-relaxed text-slate-200 font-medium">
                    <RichContent
                      value={flashcards[currentIdx].a}
                      imageClassName="max-h-48"
                    />
                  </div>
                </div>
                <p className="pt-6 text-slate-500 text-xs text-center w-full mt-auto">
                  点击卡片返回问题
                </p>
              </div>
            </div>
          </div>

          {/* 控制按钮 */}
          <div className="flex items-center justify-between gap-2 sm:gap-4 mt-5 sm:mt-8">
            <button
              disabled={currentIdx === 0}
              onClick={() => {
                setCurrentIdx(currentIdx - 1);
                setFlipped(false);
              }}
              className="min-h-12 flex flex-1 sm:flex-none items-center justify-center gap-1 sm:gap-2 px-3 sm:px-6 py-3 bg-white text-slate-600 hover:text-slate-800 border rounded-xl font-bold shadow-sm transition-all disabled:opacity-30 disabled:pointer-events-none"
            >
              <ChevronLeft size={20} /> 上一题
            </button>
            <button
              onClick={() => {
                if (currentIdx < flashcards.length - 1) {
                  setCurrentIdx(currentIdx + 1);
                  setFlipped(false);
                } else {
                  setView("menu");
                }
              }}
              className="min-h-12 flex flex-1 sm:flex-none items-center justify-center gap-1 sm:gap-2 px-3 sm:px-6 py-3 bg-brand-800 hover:bg-brand-900 text-white rounded-xl font-bold shadow-sm transition-all"
            >
              {currentIdx === flashcards.length - 1 ? "完成复习" : "下一题"}{" "}
              <ChevronRight size={20} />
            </button>
          </div>

          {/* 简答题快速导航模态框 */}
          {showNavModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-2xl sm:rounded-2xl max-w-lg w-full max-h-[85dvh] overflow-hidden flex flex-col shadow-2xl">
                <div className="p-4 sm:p-5 border-b flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <Layers size={18} className="text-brand-600" />{" "}
                    简答题卡片目录
                  </h3>
                  <button
                    onClick={() => setShowNavModal(false)}
                    aria-label="关闭卡片目录"
                    className="inline-flex h-11 w-11 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-200 text-2xl font-normal"
                  >
                    &times;
                  </button>
                </div>
                <div className="p-4 sm:p-6 pb-[max(1rem,env(safe-area-inset-bottom))] overflow-y-auto grid grid-cols-5 sm:grid-cols-6 gap-2">
                  {flashcards.map((_, i) => (
                    <button
                      key={i}
                      onClick={() => jumpToQuestion(i)}
                      className={`min-h-11 py-2 text-sm font-bold rounded-lg border transition-all ${currentIdx === i ? "bg-brand-800 border-brand-800 text-white" : "border-slate-200 hover:border-brand-500 text-slate-700 hover:bg-brand-50"}`}
                    >
                      {i + 1}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
  }

  // 渲染 React 页面
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>

<!-- React 挂载点 -->
<div id="root"></div>

<script>
  const mcqs = [];
  const flashcards = [];
</script>

<script type="text/babel">
  const { useState, useEffect } = React;

  // 自定义 SVG 图标组件，替代有 bug 的 Lucide-React 库，解决 Infinity 冲突
  const CheckCircle2 = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2.5"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <circle cx="12" cy="12" r="10" />
      <path d="m9 12 2 2 4-4" />
    </svg>
  );

  const XCircle = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2.5"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <circle cx="12" cy="12" r="10" />
      <path d="m15 9-6 6" />
      <path d="m9 9 6 6" />
    </svg>
  );

  const CreditCard = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <rect width="20" height="14" x="2" y="5" rx="2" />
      <line x1="2" x2="22" y1="10" y2="10" />
    </svg>
  );

  const ListChecks = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="m3 17 2 2 4-4" />
      <path d="m3 7 2 2 4-4" />
      <path d="M13 6h8" />
      <path d="M13 12h8" />
      <path d="M13 18h8" />
      <path d="m3 12 2 2 4-4" />
    </svg>
  );

  const Trophy = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
      <path d="M4 22h16" />
      <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34" />
      <path d="M12 2a6 6 0 0 1 6 6v3.5c0 1.63-1.22 3.14-2.85 3.3a6 6 0 0 1-6.3-5.96V8a6 6 0 0 1 6-6Z" />
    </svg>
  );

  const ChevronRight = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="m9 18 6-6-6-6" />
    </svg>
  );

  const ChevronLeft = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
  );

  const Lightbulb = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
      <path d="M9 18h6" />
      <path d="M10 22h4" />
    </svg>
  );

  const BookOpen = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
    </svg>
  );

  const Layers = ({ size = 24, className = "" }) => (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      <path d="m12 3-10 5L12 13l10-5-10-5Z" />
      <path d="m2 17 10 5 10-5" />
      <path d="m2 12 10 5 10-5" />
    </svg>
  );

  function App() {
    const [view, setView] = useState("menu"); // 'menu', 'quiz', 'flashcard'
    const [currentIdx, setCurrentIdx] = useState(0);
    const [score, setScore] = useState(0);
    const [showResult, setShowResult] = useState(false);
    const [selectedOptions, setSelectedOptions] = useState([]);
    const [isAnswerSubmitted, setIsAnswerSubmitted] = useState(false);
    const [flipped, setFlipped] = useState(false);
    const [showNavModal, setShowNavModal] = useState(false); // 题目跳转导航面板显隐状态

    // 答错记录追踪（供最后结果页查看分析）
    const [wrongAnswers, setWrongAnswers] = useState([]);

    const resetState = () => {
      setCurrentIdx(0);
      setScore(0);
      setShowResult(false);
      setSelectedOptions([]);
      setIsAnswerSubmitted(false);
      setFlipped(false);
      setWrongAnswers([]);
    };

    // 将旧版单值 c 和新版列表 c 统一为答案索引列表。
    const getCorrectAnswers = (question) =>
      Array.isArray(question.c) ? question.c : [question.c];

    const submitQuizAnswer = (userAnswers) => {
      if (isAnswerSubmitted || userAnswers.length === 0) return;

      const correctAnswers = getCorrectAnswers(mcqs[currentIdx]);
      const sortedUserAnswers = [...userAnswers].sort((a, b) => a - b);
      const sortedCorrectAnswers = [...correctAnswers].sort((a, b) => a - b);
      const isCorrect =
        sortedUserAnswers.length === sortedCorrectAnswers.length &&
        sortedUserAnswers.every(
          (answer, index) => answer === sortedCorrectAnswers[index],
        );

      setSelectedOptions(userAnswers);
      setIsAnswerSubmitted(true);
      if (isCorrect) {
        setScore((currentScore) => currentScore + 1);
      } else {
        setWrongAnswers((answers) => [
          ...answers,
          {
            ...mcqs[currentIdx],
            userAnswers,
            userLetter: sortedUserAnswers
              .map((answer) => String.fromCharCode(65 + answer))
              .join("、"),
            correctLetter: sortedCorrectAnswers
              .map((answer) => String.fromCharCode(65 + answer))
              .join("、"),
          },
        ]);
      }

      setTimeout(() => {
        if (currentIdx < mcqs.length - 1) {
          setCurrentIdx((index) => index + 1);
          setSelectedOptions([]);
          setIsAnswerSubmitted(false);
        } else {
          setShowResult(true);
        }
      }, 1400);
    };

    const handleQuizAnswer = (idx) => {
      if (isAnswerSubmitted) return;

      const isMultipleChoice =
        getCorrectAnswers(mcqs[currentIdx]).length > 1;
      if (!isMultipleChoice) {
        submitQuizAnswer([idx]);
        return;
      }

      setSelectedOptions((options) =>
        options.includes(idx)
          ? options.filter((option) => option !== idx)
          : [...options, idx],
      );
    };

    // 跳转到指定题目
    const jumpToQuestion = (idx) => {
      setCurrentIdx(idx);
      setSelectedOptions([]);
      setIsAnswerSubmitted(false);
      setFlipped(false);
      setShowNavModal(false);
    };

    if (view === "menu") {
      return (
        <div className="max-w-2xl mx-auto pt-16 px-6">
          <div className="text-center mb-12">
            <div className="inline-flex p-4 bg-blue-50 text-blue-600 rounded-3xl mb-4">
              <BookOpen size={48} />
            </div>
            <h1 className="text-4xl font-extrabold text-slate-900 tracking-tight mb-3">
              <div>title</div>
            </h1>
            <p className="text-lg text-slate-500">
              <div>description</div>
            </p>
          </div>

          <div className="grid md:grid-cols-2 gap-6 mb-8">
            <button
              onClick={() => {
                setView("quiz");
                resetState();
              }}
              className="flex flex-col text-left p-6 bg-white border border-slate-200 rounded-2xl hover:border-blue-500 hover:shadow-lg transition-all group"
            >
              <div className="p-3 bg-blue-50 text-blue-600 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors mb-4 w-fit">
                <ListChecks size={28} />
              </div>
              <h3 className="font-bold text-xl text-slate-800 mb-1">
                选择题闯关
              </h3>
              <span className="mt-auto text-blue-600 text-sm font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                开始挑战 <ChevronRight size={16} />
              </span>
            </button>

            <button
              onClick={() => {
                setView("flashcard");
                resetState();
              }}
              className="flex flex-col text-left p-6 bg-white border border-slate-200 rounded-2xl hover:border-emerald-500 hover:shadow-lg transition-all group"
            >
              <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl group-hover:bg-emerald-600 group-hover:text-white transition-colors mb-4 w-fit">
                <CreditCard size={28} />
              </div>
              <h3 className="font-bold text-xl text-slate-800 mb-1">
                简答题抽认卡
              </h3>
              <span className="mt-auto text-emerald-600 text-sm font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                开始背诵 <ChevronRight size={16} />
              </span>
            </button>
          </div>
        </div>
      );
    }

    if (view === "quiz") {
      return (
        <div className="max-w-2xl mx-auto pt-8 px-4">
          {/* 导航头 */}
          <div className="flex items-center justify-between mb-6">
            <button
              onClick={() => setView("menu")}
              className="text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1 font-medium"
            >
              <ChevronLeft size={18} /> 返回主页
            </button>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setShowNavModal(true)}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition-colors flex items-center gap-1"
              >
                <Layers size={14} /> 跳转题目
              </button>
              <div className="px-3 py-1.5 bg-blue-50 text-blue-700 rounded-lg text-sm font-bold">
                进度: {currentIdx + 1} / {mcqs.length}
              </div>
            </div>
          </div>

          {/* 进度条 */}
          <div className="w-full h-2 bg-slate-200 rounded-full mb-8 overflow-hidden">
            <div
              className="h-full bg-blue-600 transition-all duration-300"
              style={{ width: `${((currentIdx + 1) / mcqs.length) * 100}%` }}
            ></div>
          </div>

          {!showResult ? (
            <div>
              <div className="mb-6 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">
                    QUESTION {currentIdx + 1}
                  </span>
                  <span
                    className={`px-2 py-0.5 rounded-full text-xs font-bold ${
                      getCorrectAnswers(mcqs[currentIdx]).length > 1
                        ? "bg-violet-100 text-violet-700"
                        : "bg-blue-100 text-blue-700"
                    }`}
                  >
                    {getCorrectAnswers(mcqs[currentIdx]).length > 1
                      ? "多选题"
                      : "单选题"}
                  </span>
                </div>
                <h2 className="text-xl font-bold text-slate-800 leading-snug">
                  {mcqs[currentIdx].q}
                </h2>
                {getCorrectAnswers(mcqs[currentIdx]).length > 1 && (
                  <p className="text-sm text-slate-500 mt-3">
                    可选择多个答案，选好后点击“提交答案”
                  </p>
                )}
              </div>
              <div className="grid gap-3">
                {mcqs[currentIdx].a.map((opt, i) => {
                  const correctAnswers = getCorrectAnswers(mcqs[currentIdx]);
                  const isSelected = selectedOptions.includes(i);
                  const isCorrectOption = correctAnswers.includes(i);
                  let style =
                    "border-slate-200 bg-white hover:border-slate-300 hover:shadow-sm";
                  if (isAnswerSubmitted) {
                    if (isCorrectOption) {
                      style =
                        "border-emerald-500 bg-emerald-50 text-emerald-800 font-semibold";
                    } else if (isSelected) {
                      style =
                        "border-rose-500 bg-rose-50 text-rose-800 font-semibold";
                    } else {
                      style = "border-slate-100 bg-slate-50 text-slate-400";
                    }
                  } else if (isSelected) {
                    style =
                      "border-violet-500 bg-violet-50 text-violet-800 font-semibold shadow-sm";
                  }
                  return (
                    <button
                      key={i}
                      onClick={() => handleQuizAnswer(i)}
                      aria-pressed={isSelected}
                      disabled={isAnswerSubmitted}
                      className={`p-5 text-left border-2 rounded-xl transition-all duration-200 flex items-center justify-between ${style}`}
                    >
                      <span className="leading-relaxed">
                        {String.fromCharCode(65 + i)}. {opt}
                      </span>
                      {isAnswerSubmitted && isCorrectOption && (
                        <CheckCircle2 className="text-emerald-500 shrink-0 ml-3" />
                      )}
                      {isAnswerSubmitted && isSelected && !isCorrectOption && (
                        <XCircle className="text-rose-500 shrink-0 ml-3" />
                      )}
                      {!isAnswerSubmitted &&
                        isSelected &&
                        correctAnswers.length > 1 && (
                          <CheckCircle2 className="text-violet-500 shrink-0 ml-3" />
                        )}
                    </button>
                  );
                })}
              </div>
              {getCorrectAnswers(mcqs[currentIdx]).length > 1 &&
                !isAnswerSubmitted && (
                  <button
                    onClick={() => submitQuizAnswer(selectedOptions)}
                    disabled={selectedOptions.length === 0}
                    className="mt-5 w-full px-6 py-3 bg-violet-600 text-white rounded-xl font-bold hover:bg-violet-700 transition-colors shadow-md disabled:bg-slate-300 disabled:cursor-not-allowed disabled:shadow-none"
                  >
                    提交答案
                    {selectedOptions.length > 0 &&
                      `（已选 ${selectedOptions.length} 项）`}
                  </button>
                )}
            </div>
          ) : (
            <div className="text-center py-12 px-6 bg-white rounded-3xl shadow-sm border border-slate-200">
              <Trophy
                size={72}
                className="mx-auto text-yellow-500 mb-4 animate-bounce"
              />
              <h2 className="text-3xl font-extrabold text-slate-800 mb-2">
                测试完成!
              </h2>
              <p className="text-slate-500 mb-6">
                您的正确率达到了{" "}
                <span className="text-blue-600 font-bold text-2xl">
                  {Math.round((score / mcqs.length) * 100)}%
                </span>
              </p>

              <div className="bg-slate-50 border border-slate-100 rounded-xl p-4 mb-8 text-sm inline-flex gap-8">
                <div>
                  正确题数:{" "}
                  <span className="font-bold text-emerald-600">{score}</span>
                </div>
                <div>
                  错误题数:{" "}
                  <span className="font-bold text-rose-500">
                    {mcqs.length - score}
                  </span>
                </div>
              </div>

              {wrongAnswers.length > 0 && (
                <div className="text-left mb-8 max-h-72 overflow-y-auto border border-slate-200 rounded-xl p-4 bg-slate-50">
                  <h3 className="font-bold text-slate-700 mb-3 border-b pb-2">
                    错题汇总
                  </h3>
                  <div className="space-y-4">
                    {wrongAnswers.map((item, idx) => (
                      <div key={idx} className="text-xs">
                        <p className="font-semibold text-slate-800">
                          {idx + 1}. {item.q}
                        </p>
                        <p className="text-rose-600 mt-1">
                          您的回答: {item.userLetter} (错误)
                        </p>
                        <p className="text-emerald-600">
                          正确答案: {item.correctLetter}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex gap-4 justify-center">
                <button
                  onClick={resetState}
                  className="px-6 py-3 bg-slate-100 text-slate-700 rounded-full font-bold hover:bg-slate-200 transition-colors"
                >
                  重新测试
                </button>
                <button
                  onClick={() => {
                    resetState();
                    setView("menu");
                  }}
                  className="px-6 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700 transition-colors shadow-md"
                >
                  返回主页
                </button>
              </div>
            </div>
          )}

          {/* 选择题快速导航模态框 */}
          {showNavModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full max-h-[80vh] overflow-hidden flex flex-col shadow-2xl">
                <div className="p-5 border-b flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <Layers size={18} className="text-blue-500" />{" "}
                    选择题目录跳转
                  </h3>
                  <button
                    onClick={() => setShowNavModal(false)}
                    className="text-slate-400 hover:text-slate-600 text-xl font-bold"
                  >
                    &times;
                  </button>
                </div>
                <div className="p-6 overflow-y-auto grid grid-cols-6 gap-2">
                  {mcqs.map((_, i) => (
                    <button
                      key={i}
                      onClick={() => jumpToQuestion(i)}
                      className={`py-2 text-xs font-bold rounded-lg border transition-all ${currentIdx === i ? "bg-blue-600 border-blue-600 text-white" : "border-slate-200 hover:border-blue-500 text-slate-700 hover:bg-slate-50"}`}
                    >
                      {i + 1}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    if (view === "flashcard") {
      return (
        <div className="max-w-2xl mx-auto pt-8 px-4">
          {/* 导航头 */}
          <div className="flex items-center justify-between mb-6">
            <button
              onClick={() => setView("menu")}
              className="text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1 font-medium"
            >
              <ChevronLeft size={18} /> 返回主页
            </button>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setShowNavModal(true)}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition-colors flex items-center gap-1"
              >
                <Layers size={14} /> 选卡列表
              </button>
              <div className="px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg text-sm font-bold">
                卡片: {currentIdx + 1} / {flashcards.length}
              </div>
            </div>
          </div>

          {/* 进度条 */}
          <div className="w-full h-2 bg-slate-200 rounded-full mb-8 overflow-hidden">
            <div
              className="h-full bg-emerald-600 transition-all duration-300"
              style={{
                width: `${((currentIdx + 1) / flashcards.length) * 100}%`,
              }}
            ></div>
          </div>

          {/* 翻转卡片结构 */}
          <div
            className={`flip-card ${flipped ? "flipped" : ""} w-full`}
            onClick={() => setFlipped(!flipped)}
          >
            <div className="flip-card-inner">
              {/* 卡片正面 (问题) */}
              <div className="flip-card-front bg-white border border-slate-200 text-slate-800 flex flex-col justify-between">
                <div className="p-3 bg-emerald-50 text-emerald-500 rounded-full mt-4 self-center">
                  <Lightbulb size={28} />
                </div>
                <div className="my-auto px-4">
                  <span className="text-xs font-bold text-slate-400 block mb-2">
                    QUESTION {currentIdx + 1}
                  </span>
                  <h3 className="text-xl font-bold leading-relaxed">
                    {flashcards[currentIdx].q}
                  </h3>
                </div>
                <p className="text-slate-400 text-xs font-medium pb-4 flex items-center gap-1 animate-pulse">
                  <svg
                    className="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      strokeWidth="2"
                      d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"
                    />
                  </svg>
                  点击卡片翻看参考答案
                </p>
              </div>

              {/* 卡片背面 (要点解析) */}
              <div className="flip-card-back bg-slate-900 text-white border border-slate-800 text-left items-start overflow-y-auto scrollbar-hide flex flex-col justify-between">
                <div className="w-full">
                  <h4 className="text-emerald-400 font-bold mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                    <CheckCircle2 size={18} /> 核心要点 / 答案分析
                  </h4>
                  <p className="text-base leading-relaxed text-slate-200 whitespace-pre-wrap font-medium">
                    {flashcards[currentIdx].a}
                  </p>
                </div>
                <p className="pt-6 text-slate-500 text-xs text-center w-full mt-auto">
                  点击卡片返回问题
                </p>
              </div>
            </div>
          </div>

          {/* 控制按钮 */}
          <div className="flex items-center justify-between mt-8">
            <button
              disabled={currentIdx === 0}
              onClick={() => {
                setCurrentIdx(currentIdx - 1);
                setFlipped(false);
              }}
              className="flex items-center gap-2 px-6 py-3 bg-white text-slate-600 hover:text-slate-800 border rounded-xl font-bold shadow-sm transition-all disabled:opacity-30 disabled:pointer-events-none"
            >
              <ChevronLeft size={20} /> 上一题
            </button>
            <button
              onClick={() => {
                if (currentIdx < flashcards.length - 1) {
                  setCurrentIdx(currentIdx + 1);
                  setFlipped(false);
                } else {
                  setView("menu");
                }
              }}
              className="flex items-center gap-2 px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold shadow-sm transition-all"
            >
              {currentIdx === flashcards.length - 1 ? "完成复习" : "下一题"}{" "}
              <ChevronRight size={20} />
            </button>
          </div>

          {/* 简答题快速导航模态框 */}
          {showNavModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full max-h-[80vh] overflow-hidden flex flex-col shadow-2xl">
                <div className="p-5 border-b flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <Layers size={18} className="text-emerald-500" />{" "}
                    简答题卡片目录
                  </h3>
                  <button
                    onClick={() => setShowNavModal(false)}
                    className="text-slate-400 hover:text-slate-600 text-xl font-bold"
                  >
                    &times;
                  </button>
                </div>
                <div className="p-6 overflow-y-auto grid grid-cols-6 gap-2">
                  {flashcards.map((_, i) => (
                    <button
                      key={i}
                      onClick={() => jumpToQuestion(i)}
                      className={`py-2 text-xs font-bold rounded-lg border transition-all ${currentIdx === i ? "bg-emerald-600 border-emerald-600 text-white" : "border-slate-200 hover:border-emerald-500 text-slate-700 hover:bg-slate-50"}`}
                    >
                      {i + 1}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
  }

  // 渲染 React 页面
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
